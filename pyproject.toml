[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-engine"
version = "1.0.0"
description = "Autonomous Self-Evolution & 3-Tier Memory Architecture for AI Coding Agents"
readme = "README.md"
authors = [{ name = "Antigravity & Hermes Community" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
hermes-curator = "scripts.curator:main"

[tool.setuptools.packages.find]
include = ["hermes_engine*", "scripts*"]
exclude = ["templates*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
